[package]
name = "keepstone-cli"
description = "Command-line client for Keepstone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keepstone"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
keepstone-core.workspace = true
keepstone-crypto.workspace = true
keepstone-log.workspace = true
keepstone-node.workspace = true
keepstone-p2p.workspace = true
clap.workspace = true
anyhow.workspace = true
hex.workspace = true
rand.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
