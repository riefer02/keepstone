[package]
name = "keepstone-daemon"
description = "Local HTTP/JSON API for Keepstone (thin-client backend for a browser UI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keepstone-daemon"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
keepstone-core.workspace = true
keepstone-crypto.workspace = true
keepstone-log.workspace = true
keepstone-node.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
serde_json = "1"
rand.workspace = true
hex.workspace = true
