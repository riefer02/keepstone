name: Bug report
description: Report something that isn't working as documented.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        **Do not report security vulnerabilities here.** See
        [SECURITY.md](https://github.com/riefer02/keepstone/blob/main/SECURITY.md)
        for private disclosure.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands or code. Include the drop id / data-dir setup if relevant.
      placeholder: |
        1. cargo xtask demo
        2. ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit hash, tag, or branch.
      placeholder: main @ 7ad4f8e
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
      placeholder: rustc 1.88.0 (6b00bc388 2025-06-23)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (unsupported, but tell us)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any error output. This is automatically formatted as code.
      render: shell
    validations:
      required: false
